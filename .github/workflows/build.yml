name: Build Fabric mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        id: find
        run: |
          mkdir -p /tmp/proj
          unzip -q ./*.zip -d /tmp/proj
          DIR=$(dirname "$(find /tmp/proj -name settings.gradle | head -1)")
          echo "Project dir: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
          build-root-directory: ${{ steps.find.outputs.dir }}

      - name: Build mod
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: web-bypass-jar
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error